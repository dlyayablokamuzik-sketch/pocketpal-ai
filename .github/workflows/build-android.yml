name: Build Custom PocketPal APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Prepare environment files
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
          touch .env
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "pocketpal-local",
              "storage_bucket": "pocketpal-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpalai" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpalai.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpalai.e2e" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpal" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpal.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.pocketpal.e2e" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalBuild123456789" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          mkdir -p android/app/src/debug android/app/src/e2eDebug
          cp android/app/google-services.json android/app/src/debug/google-services.json
          cp android/app/google-services.json android/app/src/e2eDebug/google-services.json

      - name: Build Debug APK
        working-directory: ./android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleDebug -x assembleE2eDebug -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-Custom-APK
          path: android/app/build/outputs/apk/**/debug/*.apk
          
          
